[package]
name = "rcp"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
description = "Remote Control Protocol for automotive zonal architecture"
keywords = ["automotive", "rcp", "functional-safety", "iso26262"]
categories = ["embedded", "network-programming"]

[lib]
name = "rcp"
path = "src/lib.rs"

[[bin]]
name = "rust-rcp"
path = "src/bin/rcp.rs"

[dependencies]
thiserror   = "1"
parking_lot = "0.12"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
base64      = "0.22"
chrono      = { version = "0.4", features = ["serde"] }
tokio       = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
async-trait = "0.1"

[dev-dependencies]
tempfile   = "3"
tokio-test = "0.4"

[profile.release]
strip        = true
opt-level    = "z"
lto          = true
codegen-units = 1
