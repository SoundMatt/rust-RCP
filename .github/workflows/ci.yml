name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ── Test (cross-platform) ─────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --all-targets --locked
      - name: test
        run: cargo test --all-targets --locked
      - name: test release
        run: cargo test --all-targets --release --locked

  # ── Coverage ──────────────────────────────────────────────────────────────
  coverage:
    name: Coverage (llvm-cov)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: collect coverage
        run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - name: enforce threshold
        run: cargo llvm-cov --all-targets --fail-under-lines 90
      - name: upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ── FuSa gap check ────────────────────────────────────────────────────────
  fusa:
    name: FuSa gap check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run gap check
        run: bash scripts/fusa-gap-check.sh

  # ── Public API stability (ROADMAP.md Milestone 10) ───────────────────────
  # See docs/SEMVER.md for the stability policy this snapshot enforces.
  api-stability:
    name: Public API stability (cargo public-api)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-public-api
        run: cargo install cargo-public-api --locked
      - name: check public API surface against committed snapshot
        run: bash scripts/api-snapshot-check.sh

  # ── Fuzz (short) ─────────────────────────────────────────────────────────
  fuzz:
    name: Fuzz (30s smoke)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz NTSCF frame decoder (30s)
        run: |
          if [ -d fuzz ]; then
            cargo +nightly fuzz run fuzz_wire_decode -- -max_total_time=30
          else
            echo "fuzz targets not yet configured, skipping"
          fi
      - name: fuzz AVTPDU/ACF decoders (30s)
        run: |
          if [ -d fuzz ]; then
            cargo +nightly fuzz run fuzz_avtpdu_acf_decode -- -max_total_time=30
          else
            echo "fuzz targets not yet configured, skipping"
          fi

  # ── Benchmark smoke ───────────────────────────────────────────────────────
  bench-smoke:
    name: Benchmark smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: bench (1 iteration)
        run: cargo bench -- --test 2>/dev/null || cargo test --release

  # ── RELAY §12 CLI conformance (relay conform) ─────────────────────────────
  relay-conform:
    name: RELAY conform --strict
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install relay
        run: go install github.com/SoundMatt/RELAY/cmd/relay@latest
      - name: build rcp binary
        run: cargo build --bin rust-rcp --release --locked
      - name: relay conform --strict
        run: relay conform --strict target/release/rust-rcp

  # ── RELAY interop ─────────────────────────────────────────────────────────
  relay-interop:
    name: RELAY interop
    needs: relay-conform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install relay
        run: go install github.com/SoundMatt/RELAY/cmd/relay@latest
      - name: build rcp binary
        run: cargo build --bin rust-rcp --release --locked
      - name: relay interop (rcp-status EQUIVALENT)
        run: |
          output=$(relay interop target/release/rust-rcp 2>&1) || true
          echo "$output"
          if echo "$output" | grep -q "rcp-status"; then
            echo "$output" | grep -A3 "^rcp-status" | grep "rcp" | grep -q "EQUIVALENT"
          else
            echo "relay interop: no RCP vectors found on runner — skipping equivalence check"
          fi

  # ── RELAY wire+e2e unit tests (spec traceability) ─────────────────────────
  relay-conformance:
    name: RELAY spec v1.11 unit conformance
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run RELAY conformance tests
        run: |
          cargo test --lib -- 'wire::' 2>&1
          cargo test --lib -- 'e2e::' 2>&1
          cargo test --lib -- 'relay::' 2>&1
          cargo test --lib -- 'adapt::' 2>&1

  # ── IEC 62443 cyber gap check ─────────────────────────────────────────────
  cyber:
    name: IEC 62443 cyber gap check
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run cyber gap check
        run: bash scripts/cyber-gap-check.sh

  # ── Full rust-FuSa lifecycle (§20.1.2) ────────────────────────────────────
  # RELAY spec §20.1 item 2: the language safety tool run across its full
  # lifecycle — standard check (ERROR-gated), requirement traceability,
  # cybersecurity analysis, dependency vulnerability scan (see the separate
  # `audit` job), and tool qualification — not just this repo's own
  # `fusa-gap-check.sh`/`cyber-gap-check.sh` scripts (the `fusa`/`cyber` jobs
  # above), which predate rust-FuSa's own CI integration.
  rust-fusa:
    name: rust-FuSa full lifecycle
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install rsfusa
        run: cargo install --git https://github.com/SoundMatt/rust-FuSa rsfusa --locked
      - name: build release binary (needed for qualify)
        # Cargo.lock is committed (this crate ships a binary, src/bin/rcp.rs)
        # and built --locked so the qualified release artifact matches the
        # audited/shipped dependency graph exactly.
        run: cargo build --release --locked

      - name: coding standard lint (best-effort)
        run: rsfusa lint --dir . --format json --output lint-report.json || true
      - name: static analysis (best-effort)
        run: rsfusa analyze --dir . --format json --output analyze-report.json || true
      - name: cyclomatic complexity V(G) (best-effort)
        run: rsfusa comp --dir . --format json --output comp-report.json || true

      - name: safety check — gates on ERROR findings (§20.1 item 2)
        run: rsfusa check --dir . --format json --output check-report.json
      - name: safety check SARIF, strict (best-effort, code scanning)
        run: rsfusa check --dir . --strict --format sarif --output results.sarif || true

      - name: requirement traceability matrix (§20.1 item 2 / §20.4)
        run: |
          rsfusa trace --dir . --format json --output trace.json
          rsfusa trace --dir . --format text

      - name: FMEA (best-effort, §20.4 dFMEA evidence)
        run: rsfusa fmea --dir . || true
      - name: TARA (§20.4) — see the hand-authored tara.json for the source of truth
        run: rsfusa tara --dir .
      - name: cybersecurity analysis — CWE-mapped (§20.1 item 2)
        run: rsfusa cyber --dir . --format json --output cyber-report.json
      - name: boundary diagram (best-effort)
        run: rsfusa boundary --dir . || true
      - name: HARA (best-effort)
        run: rsfusa hara show --dir . || true
      - name: safety case assembly (best-effort)
        run: rsfusa safety-case --dir . || true
      - name: ISO 26262 Part 6 gap report (best-effort)
        run: rsfusa iso26262 --dir . --format json --output iso26262-gap-report.json || true

      - name: tool qualification (§20.1 item 2)
        run: rsfusa qualify

      - name: release artifacts — SBOM, provenance, manifest (§20.5)
        run: rsfusa release --dir .
      - name: audit pack (best-effort)
        run: rsfusa audit-pack --output audit-pack.zip || true

      - name: upload SARIF to GitHub code scanning
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: upload safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fusa-safety-evidence
          path: |
            check-report.json
            lint-report.json
            analyze-report.json
            comp-report.json
            cyber-report.json
            trace.json
            fmea.json
            tara.json
            tara.md
            safety-case.json
            safety-case.md
            iso26262-gap-report.json
            qualify-report.json
            sbom.json
            provenance.json
            artifact-manifest.json
            audit-pack.zip
          if-no-files-found: warn

  # ── SBOM ─────────────────────────────────────────────────────────────────
  sbom:
    name: SBOM (CycloneDX)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked
      - name: generate SBOM
        run: cargo cyclonedx --format json --override-filename bom.json --locked
      - name: upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

  # ── Security audit ────────────────────────────────────────────────────────
  audit:
    name: Security audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
